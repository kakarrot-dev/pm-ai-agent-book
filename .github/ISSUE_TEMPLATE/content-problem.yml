name: 内容问题
description: 报告事实、逻辑、术语、链接或排版问题
title: "[内容] "
body:
  - type: dropdown
    id: book
    attributes:
      label: 所属篇章
      options:
        - 入门篇 book1
        - 进阶篇 book2
        - 项目说明或其他
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 章节与位置
      description: 请提供文件路径、标题或行号。
      placeholder: book1/03-user-research-and-task-modeling.md，任务状态一节
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 说明哪里不准确、不清楚或无法验证。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改
      description: 如果涉及事实更新，请附上一手来源。
