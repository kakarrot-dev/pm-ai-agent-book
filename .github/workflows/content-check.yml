name: Content check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate content
        run: node scripts/check-content.mjs

      - name: Verify generated chapter navigation
        run: |
          node scripts/update-navigation.mjs
          git diff --exit-code
